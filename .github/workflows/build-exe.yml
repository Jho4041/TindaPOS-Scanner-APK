name: Build TindaPOS EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build EXE
        working-directory: electron-pc
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force ../www www
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TindaPOS-Windows-EXE
          path: electron-pc/dist/*.exe
          if-no-files-found: error
